# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-toradex-torizon-mixins"
BBFILE_PATTERN_meta-toradex-torizon-mixins = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-toradex-torizon-mixins = "99"

LAYERDEPENDS_meta-toradex-torizon-mixins = "meta-toradex-torizon"
LAYERSERIES_COMPAT_meta-toradex-torizon-mixins = "kirkstone scarthgap"
